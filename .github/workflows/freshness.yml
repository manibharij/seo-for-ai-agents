name: Freshness check

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check stamps and source links
        id: check
        run: |
          set +e
          python3 scripts/check-freshness.py --strict --output freshness-report.md
          code=$?
          set -e
          cat freshness-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Open or update the freshness issue
        if: steps.check.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Freshness check: facts to re-verify"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file freshness-report.md
            gh issue comment "$number" --body "Report updated by $RUN_URL"
          else
            gh issue create --title "$TITLE" --body-file freshness-report.md
          fi
